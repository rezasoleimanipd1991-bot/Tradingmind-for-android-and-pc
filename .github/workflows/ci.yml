name: CI checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - "dependabot/**"
    paths:
      - "artifacts/tradermind/**"
      - "lib/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Typecheck
        run: pnpm --filter @workspace/tradermind run typecheck
      - name: Unit tests
        run: pnpm --filter @workspace/tradermind run test -- --reporter=dot
      - name: Build web app
        run: pnpm --filter @workspace/tradermind run build:web
